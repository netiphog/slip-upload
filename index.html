<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>แจ้งอัพโหลดสลิป</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      /* Modern Professional Mobile UI — Clean, Minimal, Enterprise App Style */
      --primary: #146C43;
      --primary-dark: #0F5132;
      --primary-soft: #E7F5EC;
      --bg: #F6F7F9;
      --card-bg: #ffffff;
      --text: #1C1F26;
      --muted: #8A8F98;
      --border: #E7E9ED;
      --radius: 20px;
      --radius-sm: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 0;
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      color: var(--text);
      padding: calc(20px + env(safe-area-inset-top)) 20px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    #infoBtn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--border);
      border: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-style: italic;
      font-family: Georgia, serif;
      transition: background 0.15s, transform 0.05s;
    }
    #infoBtn:active { background: #dcdfe4; transform: scale(0.94); }

    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 20px 20px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13.5px;
      margin: 0 0 18px;
      line-height: 1.5;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 22px 18px;
      box-shadow: 0 1px 2px rgba(20, 20, 30, 0.04), 0 8px 20px rgba(20, 20, 30, 0.04);
      border: 1px solid var(--border);
    }

    label {
      font-size: 13.5px;
      font-weight: 600;
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      color: var(--text);
    }
    label:first-child { margin-top: 0; }

    input[type="text"] {
      width: 100%;
      padding: 14px 15px;
      font-size: 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    input[type="text"]::placeholder {
      font-size: 13.5px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .upload-box {
      margin-top: 8px;
      border: 1.5px dashed var(--border);
      border-radius: var(--radius-sm);
      padding: 26px 16px;
      text-align: center;
      background: var(--bg);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .upload-box.has-image { border-style: solid; padding: 12px; background: var(--bg); }
    .upload-box input[type="file"] { display: none; }
    .upload-hint { color: var(--muted); font-size: 13.5px; font-weight: 500; }
    .upload-hint svg { display: block; margin: 0 auto 10px; }

    #preview {
      max-width: 100%;
      max-height: 260px;
      border-radius: var(--radius-sm);
      display: none;
      margin: 0 auto;
    }

    button[type="submit"] {
      width: 100%;
      padding: 16px;
      margin-top: 26px;
      font-size: 16px;
      font-weight: 600;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(20, 20, 30, 0.12);
      transition: background 0.15s, transform 0.05s, box-shadow 0.15s;
    }
    button[type="submit"]:active { transform: scale(0.98); background: var(--primary-dark); box-shadow: 0 2px 6px rgba(20, 20, 30, 0.1); }
    button[type="submit"]:disabled { background: #D8D8E0; box-shadow: none; }

    .footnote {
      text-align: center;
      color: var(--muted);
      font-size: 12.5px;
      margin-top: 18px;
      line-height: 1.6;
    }

    /* Alerts แบบ illustrative: วงกลมไอคอนใหญ่ + จุดตกแต่ง + หัวข้อ/คำอธิบายกลางจอ + ปุ่ม pill */
    .swal2-popup { font-family: inherit !important; box-shadow: 0 10px 40px rgba(20,20,30,0.18) !important; }
    .swal2-toast { border-radius: var(--radius-sm) !important; box-shadow: 0 6px 20px rgba(20,20,30,0.12) !important; }

    .native-alert {
      width: 300px !important;
      border-radius: 26px !important;
      padding: 30px 24px 22px !important;
    }
    .native-alert.native-alert-wide { width: 320px !important; padding: 26px 22px 20px !important; }

    /* ----- ไอคอนวงกลม + จุดตกแต่งแบบ confetti ----- */
    .native-alert-icon-wrap {
      position: relative;
      width: 120px;
      height: 96px;
      margin: 0 auto 4px;
    }
    .native-alert-icon-circle {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 22px rgba(20, 20, 30, 0.16);
    }
    .native-alert-dot { position: absolute; border-radius: 3px; transform: rotate(45deg); }

    .native-alert-title {
      font-size: 18.5px !important;
      font-weight: 800 !important;
      text-align: center !important;
      padding: 0 4px !important;
      margin: 0 0 8px !important;
      color: var(--text) !important;
    }
    .native-alert-text {
      font-size: 13.5px !important;
      color: var(--muted) !important;
      text-align: center !important;
      padding: 0 2px !important;
      margin: 0 0 24px !important;
      line-height: 1.6 !important;
    }
    .native-alert-text.align-left { text-align: left !important; }

    .native-alert-actions {
      margin: 0 !important;
      width: 100% !important;
      display: flex !important;
      gap: 10px !important;
      border-top: none !important;
    }
    .native-btn {
      flex: 1;
      margin: 0 !important;
      border-radius: 14px !important;
      font-weight: 700 !important;
      font-size: 15px !important;
      padding: 14.5px 0 !important;
      box-shadow: none !important;
      transition: transform 0.05s, opacity 0.15s;
    }
    .native-btn:active { transform: scale(0.97); }
    .native-btn-cancel {
      background: var(--bg) !important;
      color: var(--text) !important;
      border: 1.5px solid var(--border) !important;
    }
    .native-btn-confirm {
      background: var(--primary) !important;
      color: #fff !important;
      border: none !important;
    }
    .native-btn-confirm-danger {
      background: #E5484D !important;
      color: #fff !important;
      border: none !important;
    }
    .native-btn-single {
      width: 100%;
      background: var(--primary) !important;
      color: #fff !important;
      border: none !important;
    }
    .native-loading { padding-bottom: 26px !important; }
    .swal2-loader { border-color: var(--primary) transparent var(--primary) transparent !important; }

    /* ----- เนื้อหาใน infoBtn: ขั้นตอนแบบมีไอคอน (ตามภาพตัวอย่าง) ----- */
    .howto-steps {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 2px 0 0;
    }
    .howto-step { display: flex; align-items: flex-start; gap: 14px; }
    .howto-step-icon {
      flex: none;
      position: relative;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--primary-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .howto-step-badge {
      position: absolute;
      bottom: -5px;
      right: -5px;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: var(--primary);
      border: 2.5px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .howto-step-body { padding-top: 2px; }
    .howto-step-label {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 2px;
    }
    .howto-step-title { font-size: 14.5px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .howto-step-desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
    .howto-footnote {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>แจ้งอัพโหลดสลิป</h1>
    <button id="infoBtn" aria-label="เกี่ยวกับหน้านี้">i</button>
  </header>

  <main>
    <p class="subtitle">แนบรูปสลิปโอนเงิน ระบบจะบันทึกและอ่านข้อมูลให้อัตโนมัติ</p>
    <div class="card">
      <form id="slipForm">
        <label for="name">ชื่อผู้แจ้ง หรือโอนแทนใคร</label>
        <input type="text" id="name" placeholder="ชื่อ-นามสกุลผู้โอน หรือคนที่โอนแทน" required>

        <label for="slipImage">แนบรูปสลิป</label>
        <div class="upload-box" id="uploadBox">
          <label for="slipImage" style="margin:0; cursor:pointer;">
            <div class="upload-hint" id="uploadHint">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="1.6"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
              แตะเพื่อเลือกหรือถ่ายรูปสลิป
            </div>
            <img id="preview" alt="ตัวอย่างรูปสลิป">
          </label>
          <input type="file" id="slipImage" accept="image/*" capture="environment" required>
        </div>

        <button type="submit" id="submitBtn">ส่งสลิป</button>
      </form>
      <p class="footnote">ระบบจะบันทึกรูปและอ่านข้อมูลในสลิปให้อัตโนมัติ<br>กรุณาตรวจสอบความชัดเจนของรูปก่อนส่ง</p>
    </div>
  </main>

  <script>
    // ===== ตั้งค่าตรงนี้ =====
    const LIFF_ID = '2011191557-QSmaj2No';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxXE2SdXyZo3-_3ibrfa8X3s3n1A1colXlXEyzN7JLNh9iCgsda12K7UrMUESZxOYb7sQ/exec';
    // =========================

    let liffProfile = null; // เก็บโปรไฟล์ LINE ของผู้ใช้ (ใช้ userId ส่งไปให้ Apps Script push ข้อความกลับ)

    liff.init({ liffId: LIFF_ID }).then(async function () {
      try {
        if (liff.isLoggedIn()) {
          liffProfile = await liff.getProfile();
        }
      } catch (profileErr) {
        console.error('getProfile error', profileErr);
      }
    }).catch(function (err) {
      console.error('LIFF init error', err);
    });

    // ================== Alert visuals: วงกลมไอคอน + จุดตกแต่ง ==================
    const ALERT_PALETTE = {
      success: '#146C43',
      error:   '#E5484D',
      warning: '#F5A623',
      send:    '#146C43'
    };
    const ALERT_ICONS = {
      success: '<path d="M6 12.5l4 4 8-9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
      error:   '<path d="M7 7l10 10M17 7L7 17" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>',
      warning: '<path d="M12 6.5v6.2" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1.4" fill="#fff"/>',
      send:    '<path d="M12 18V6M12 6l-4.5 4.5M12 6l4.5 4.5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
    };
    function alertVisual(type) {
      const c = ALERT_PALETTE[type] || ALERT_PALETTE.success;
      const icon = ALERT_ICONS[type] || ALERT_ICONS.success;
      return `
        <div class="native-alert-icon-wrap">
          <span class="native-alert-dot" style="width:9px;height:9px;background:${c}55;top:0;left:16px;"></span>
          <span class="native-alert-dot" style="width:6px;height:6px;background:${c}45;top:16px;right:6px;"></span>
          <span class="native-alert-dot" style="width:7px;height:7px;background:${c}55;bottom:4px;left:2px;"></span>
          <span class="native-alert-dot" style="width:5px;height:5px;background:${c}45;bottom:14px;right:16px;"></span>
          <div class="native-alert-icon-circle" style="background:${c};">
            <svg width="34" height="34" viewBox="0 0 24 24">${icon}</svg>
          </div>
        </div>`;
    }
    // สร้าง alert แบบมาตรฐาน (ไอคอน + หัวข้อ + คำอธิบาย + ปุ่ม)
    function fireAlert({ type = 'success', title, text = '', confirmText = 'ตกลง', cancelText = null, confirmDanger = false }) {
      const opts = {
        html: alertVisual(type) + `<div class="native-alert-title">${title}</div>` + (text ? `<div class="native-alert-text">${text}</div>` : '<div style="margin-bottom:22px;"></div>'),
        showConfirmButton: true,
        confirmButtonText: confirmText,
        buttonsStyling: false,
        customClass: {
          popup: 'native-alert',
          actions: 'native-alert-actions',
          confirmButton: 'native-btn ' + (cancelText ? (confirmDanger ? 'native-btn-confirm-danger' : 'native-btn-confirm') : 'native-btn-single')
        }
      };
      if (cancelText) {
        opts.showCancelButton = true;
        opts.cancelButtonText = cancelText;
        opts.reverseButtons = true;
        opts.customClass.cancelButton = 'native-btn native-btn-cancel';
      }
      return Swal.fire(opts);
    }

    // ----- ปุ่ม Info: ขั้นตอนการใช้งานแบบมีไอคอน -----
    document.getElementById('infoBtn').addEventListener('click', function () {
      const steps = [
        {
          label: 'ขั้นตอนที่ 1', title: 'กรอกชื่อ-นามสกุล',
          desc: 'ระบุชื่อผู้โอน หรือชื่อคนที่คุณโอนแทน ให้ตรงกับชื่อในสลิป',
          icon: '<rect x="4" y="3" width="16" height="18" rx="2.5" stroke="var(--primary)" stroke-width="1.6" fill="none"/><path d="M8 8h8M8 12h8M8 16h5" stroke="var(--primary)" stroke-width="1.6" stroke-linecap="round"/>'
        },
        {
          label: 'ขั้นตอนที่ 2', title: 'แนบรูปสลิป',
          desc: 'ถ่ายหรือเลือกรูปสลิปโอนเงินให้ชัดเจน ระบบจะอ่านข้อมูลให้อัตโนมัติ',
          icon: '<rect x="3.5" y="6" width="17" height="13" rx="2.5" stroke="var(--primary)" stroke-width="1.6" fill="none"/><circle cx="12" cy="12.5" r="3" stroke="var(--primary)" stroke-width="1.6" fill="none"/><path d="M8.5 6l1-2h5l1 2" stroke="var(--primary)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
        },
        {
          label: 'ขั้นตอนที่ 3', title: 'กดส่งสลิป',
          desc: 'ตรวจสอบข้อมูลให้ถูกต้อง แล้วกดส่ง ระบบจะบันทึกให้ทันที',
          icon: '<path d="M4 12l16-7-6.5 16-2.5-6.5L4 12z" stroke="var(--primary)" stroke-width="1.6" fill="none" stroke-linejoin="round"/>'
        }
      ];
      const stepsHtml = steps.map(function (s) {
        return `
          <div class="howto-step">
            <div class="howto-step-icon">
              <svg width="22" height="22" viewBox="0 0 24 24">${s.icon}</svg>
              <span class="howto-step-badge"><svg width="10" height="10" viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            </div>
            <div class="howto-step-body">
              <div class="howto-step-label">${s.label}</div>
              <div class="howto-step-title">${s.title}</div>
              <div class="howto-step-desc">${s.desc}</div>
            </div>
          </div>`;
      }).join('');

      Swal.fire({
        html: `
          <div class="native-alert-title" style="margin-bottom:18px;">วิธีใช้งาน</div>
          <div class="howto-steps">${stepsHtml}</div>
          <div class="howto-footnote">หากส่งไม่สำเร็จหรือมีปัญหาการใช้งาน กรุณาติดต่อเจ้าหน้าที่</div>
        `,
        showConfirmButton: true,
        confirmButtonText: 'เข้าใจแล้ว',
        buttonsStyling: false,
        customClass: {
          popup: 'native-alert native-alert-wide',
          actions: 'native-alert-actions',
          confirmButton: 'native-btn native-btn-single'
        },
        willOpen: function (popup) {
          popup.querySelector('.howto-footnote').style.marginTop = '20px';
        }
      });
    });

    const fileInput = document.getElementById('slipImage');
    const preview = document.getElementById('preview');
    const uploadHint = document.getElementById('uploadHint');
    const uploadBox = document.getElementById('uploadBox');

    fileInput.addEventListener('change', function () {
      const file = fileInput.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        uploadHint.style.display = 'none';
        uploadBox.classList.add('has-image');
      }
    });

    document.getElementById('slipForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const name = document.getElementById('name').value.trim();
      const file = fileInput.files[0];

      if (!name) {
        fireAlert({
          type: 'warning',
          title: 'กรอกชื่อก่อนนะ',
          text: 'กรุณาระบุชื่อผู้โอน หรือชื่อคนที่คุณโอนแทน'
        });
        return;
      }
      if (!file) {
        fireAlert({
          type: 'warning',
          title: 'ยังไม่ได้แนบรูป',
          text: 'กรุณาแนบรูปสลิปก่อนส่ง'
        });
        return;
      }

      // ----- Confirm ก่อนส่งจริง -----
      const confirmResult = await Swal.fire({
        html: `
          ${alertVisual('send')}
          <div class="native-alert-title">ยืนยันการส่งสลิป?</div>
          <div class="native-alert-text" style="margin-bottom:16px;"><b>โอนแทน:</b> ${escapeHtml(name)}</div>
          <img src="${preview.src}" style="max-width:100%; max-height:190px; border-radius:14px; display:block; margin:0 auto 22px; border:1px solid var(--border);">
        `,
        showCancelButton: true,
        confirmButtonText: 'ส่งสลิป',
        cancelButtonText: 'ยกเลิก',
        reverseButtons: true,
        buttonsStyling: false,
        customClass: {
          popup: 'native-alert',
          actions: 'native-alert-actions',
          cancelButton: 'native-btn native-btn-cancel',
          confirmButton: 'native-btn native-btn-confirm'
        }
      });
      if (!confirmResult.isConfirmed) return;

      submitBtn.disabled = true;

      // ----- Loading -----
      Swal.fire({
        title: 'กำลังส่งสลิป...',
        text: 'กรุณารอสักครู่',
        allowOutsideClick: false,
        allowEscapeKey: false,
        showConfirmButton: false,
        customClass: { popup: 'native-alert native-loading', title: 'native-alert-title', htmlContainer: 'native-alert-text' },
        didOpen: () => { Swal.showLoading(); }
      });

      try {
        const base64 = await toBase64(file);

        // หมายเหตุ: ไม่ตั้ง Content-Type header เอง เพื่อเลี่ยงปัญหา CORS preflight กับ Apps Script
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({
            name: name,
            image: base64,
            mimeType: file.type,
            userId: liffProfile ? liffProfile.userId : null
          })
        });

        const result = await res.json();

        if (result.status === 'success') {
          const doneResult = await fireAlert({
            type: 'success',
            title: 'ส่งสลิปสำเร็จ',
            text: 'ระบบบันทึกและอ่านข้อมูลในสลิปของคุณเรียบร้อยแล้ว',
            confirmText: 'เสร็จสิ้น'
          });
          if (doneResult.isConfirmed || doneResult.isDismissed) {
            if (liff.isInClient && liff.isInClient()) {
              liff.closeWindow();
            } else {
              document.getElementById('slipForm').reset();
              preview.style.display = 'none';
              uploadHint.style.display = 'block';
              uploadBox.classList.remove('has-image');
              submitBtn.disabled = false;
            }
          }
        } else {
          fireAlert({
            type: 'error',
            title: 'ส่งสลิปไม่สำเร็จ',
            text: (result.message || 'ไม่ทราบสาเหตุ') + ' หากเกิดปัญหานี้ซ้ำ กรุณาติดต่อเจ้าหน้าที่'
          });
          submitBtn.disabled = false;
        }
      } catch (err) {
        fireAlert({
          type: 'error',
          title: 'ส่งไม่สำเร็จ',
          text: 'กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่ หากยังไม่ได้ กรุณาติดต่อเจ้าหน้าที่'
        });
        submitBtn.disabled = false;
      }
    });

    function toBase64(file) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function () { resolve(reader.result.split(',')[1]); };
        reader.onerror = reject;
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
