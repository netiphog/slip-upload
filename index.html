<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แจ้งอัพโหลดสลิป</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 16px; max-width: 480px; margin: 0 auto; }
    label { font-size: 14px; font-weight: bold; display: block; margin-top: 12px; }
    input[type="text"], input[type="file"] {
      width: 100%; padding: 10px; margin-top: 6px; font-size: 16px;
      border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;
    }
    button {
      width: 100%; padding: 12px; margin-top: 20px; font-size: 16px;
      background: #06C755; color: white; border: none; border-radius: 6px;
    }
    button:disabled { background: #999; }
    #preview { max-width: 100%; margin-top: 10px; border-radius: 6px; display: none; }
    #status { margin-top: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <h3>แจ้งอัพโหลดสลิป</h3>
  <form id="slipForm">
    <label>สลิปนี้โอนแทนชื่อ (ถ้าไม่ใช่ตัวเอง ให้พิมพ์ชื่อคนนั้นได้)</label>
    <input type="text" id="name" placeholder="เช่น สมชาย ใจดี" required>

    <label>แนบรูปสลิป</label>
    <input type="file" id="slipImage" accept="image/*" capture="environment" required>
    <img id="preview">

    <button type="submit" id="submitBtn">ส่งสลิป</button>
  </form>
  <p id="status"></p>

  <script>
    // ===== ตั้งค่าตรงนี้ =====
    const LIFF_ID = 'ใส่_LIFF_ID_ตรงนี้';
    const GAS_URL = 'ใส่_URL_APPS_SCRIPT_WEB_APP_ตรงนี้';
    // =========================

    liff.init({ liffId: LIFF_ID }).catch(function (err) {
      console.error('LIFF init error', err);
    });

    const fileInput = document.getElementById('slipImage');
    const preview = document.getElementById('preview');
    fileInput.addEventListener('change', function () {
      const file = fileInput.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      }
    });

    document.getElementById('slipForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const statusEl = document.getElementById('status');
      const name = document.getElementById('name').value.trim();
      const file = fileInput.files[0];

      if (!name || !file) return;

      submitBtn.disabled = true;
      statusEl.innerText = 'กำลังส่งสลิป...';

      try {
        const base64 = await toBase64(file);

        // หมายเหตุ: ไม่ตั้ง Content-Type header เอง เพื่อเลี่ยงปัญหา CORS preflight กับ Apps Script
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({
            name: name,
            image: base64,
            mimeType: file.type
          })
        });

        const result = await res.json();

        if (result.status === 'success') {
          statusEl.innerText = 'ส่งสลิปสำเร็จ ขอบคุณครับ';
          setTimeout(function () {
            if (liff.isInClient()) liff.closeWindow();
          }, 1500);
        } else {
          statusEl.innerText = 'เกิดข้อผิดพลาด: ' + result.message;
          submitBtn.disabled = false;
        }
      } catch (err) {
        statusEl.innerText = 'ส่งไม่สำเร็จ: ' + err.message;
        submitBtn.disabled = false;
      }
    });

    function toBase64(file) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function () { resolve(reader.result.split(',')[1]); };
        reader.onerror = reject;
      });
    }
  </script>
</body>
</html>
